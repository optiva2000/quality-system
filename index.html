<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Optiva — Restaurant Quality Management</title>
  <style>
    :root { --primary: #C5A059; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --border: #334155; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    header { background: var(--card); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.25rem; font-weight: bold; color: var(--primary); }
    main { flex: 1; padding: 2rem; max-width: 1200px; margin: 0 auto; width: 100%; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 0.5rem; padding: 1.5rem; margin-bottom: 1.5rem; }
    h2 { margin-bottom: 1rem; font-size: 1.2rem; color: var(--primary); }
    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; }
    input, select, textarea { width: 100%; padding: 0.75rem; border-radius: 0.375rem; border: 1px solid var(--border); background: #0f172a; color: var(--text); margin-bottom: 0.5rem; }
    button { background: var(--primary); color: #000; font-weight: bold; padding: 0.75rem 1.5rem; border: none; border-radius: 0.375rem; cursor: pointer; transition: opacity 0.2s; }
    button:hover { opacity: 0.9; }
    button.danger { background: #ef4444; color: #fff; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { padding: 0.75rem; text-align: right; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    th { color: var(--primary); }
    .hidden { display: none !important; }
    .flex { display: flex; gap: 1rem; align-items: center; }
    .error { color: #ef4444; margin-top: 0.5rem; font-size: 0.85rem; }
    .success { color: #10b981; margin-top: 0.5rem; font-size: 0.85rem; }
  </style>
</head>
<body>

  <header>
    <div class="logo">Optiva | أوبتيفا لسلامة الغذاء</div>
    <div id="userHeader" class="hidden">
      <span id="userNameRole" style="margin-left: 1rem; font-size: 0.9rem;"></span>
      <button onclick="logout()" style="padding: 0.4rem 0.8rem; font-size: 0.8rem;">تسجيل خروج</button>
    </div>
  </header>

  <main>
    <!-- شاشة تسجيل الدخول -->
    <section id="loginSection" class="card" style="max-width: 400px; margin: 4rem auto;">
      <h2>تسجيل الدخول إلى Optiva</h2>
      <div class="form-group">
        <label>اسم المستخدم</label>
        <input type="text" id="loginUser" placeholder="أدخل اسم المستخدم">
      </div>
      <div class="form-group">
        <label>كلمة المرور</label>
        <input type="password" id="loginPass" placeholder="أدخل كلمة المرور">
      </div>
      <button onclick="doLogin()" style="width: 100%;">دخول</button>
      <div id="loginError" class="error"></div>
    </section>

    <!-- لوحة التحكم العامة -->
    <section id="dashboardSection" class="hidden">
      <div id="dashboardContent"></div>
    </section>
  </main>

  <script>
    // حط رابط الـ Web App الخاص بك هنا بعد الـ Deploy
    const API_URL = "https://script.google.com/macros/s/AKfycbz.../exec"; 
    
    let authToken = localStorage.getItem('optiva_token') || '';
    let currentUser = JSON.parse(localStorage.getItem('optiva_user') || 'null');

    if (authToken && currentUser) {
      showDashboard();
    }

    async function apiCall(action, p = {}) {
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ token: authToken, action, p })
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        return data;
      } catch (err) {
        alert('خطأ: ' + err.message);
        throw err;
      }
    }

    async function doLogin() {
      const username = document.getElementById('loginUser').value.trim();
      const password = document.getElementById('loginPass').value.trim();
      const errEl = document.getElementById('loginError');
      errEl.innerText = '';

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'login', p: { username, password } })
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        authToken = data.token;
        currentUser = data.user;
        localStorage.setItem('optiva_token', authToken);
        localStorage.setItem('optiva_user', JSON.stringify(currentUser));
        
        showDashboard();
      } catch (err) {
        errEl.innerText = err.message;
      }
    }

    function logout() {
      localStorage.clear();
      authToken = '';
      currentUser = null;
      document.getElementById('dashboardSection').classList.add('hidden');
      document.getElementById('loginSection').classList.remove('hidden');
      document.getElementById('userHeader').classList.add('hidden');
    }
